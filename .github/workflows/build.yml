name: 打包 Windows exe

on:
  # 打 tag（v1.0.0 之类）时构建并发布 Release
  push:
    tags: ["v*"]
  # 手动触发（Actions 页面点 Run workflow），可选是否上传构建产物
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 构建完成后上传 exe 供下载
        type: boolean
        default: true

permissions:
  contents: write   # 发 Release 需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"        # 与本机 3.14 行为一致；3.13 官方 wheels 最全
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 跑测试
        run: python -m pytest tests -q

      - name: 打包
        run: python -m PyInstaller --noconfirm --clean build.spec

      # Portable 单文件 exe；onedir 目录一并压成 zip 方便不想解压的用户
      - name: 整理产物
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MCLogBan -DestinationPath dist/MCLogBan-onedir.zip
          Get-ChildItem dist | Select-Object Name, Length

      - name: 上传构建产物（手动触发时）
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCLogBan-windows
          path: |
            dist/MCLogBan-Portable.exe
            dist/MCLogBan-onedir.zip
          retention-days: 14

      - name: 发布 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MCLogBan-Portable.exe
            dist/MCLogBan-onedir.zip
          generate_release_notes: true
